{% extends 'base.html' %}
{% block title %}Register{% endblock %}
{% block guest_content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card p-4">
            <h3 class="mb-3">Register</h3>
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label">I am registering as</label>
                    <select class="form-select" name="role" required>
                        <option value="trekker">User (Trekker)</option>
                        <option value="staff">Trek Staff</option>
                    </select>
                    <div class="form-text">Staff accounts require admin approval before you can log in.</div>
                </div>
                <div class="mb-3">
                    <label class="form-label">Full Name</label>
                    <input type="text" class="form-control" name="name" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" class="form-control" name="email" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Phone</label>
                    <input type="text" class="form-control" name="phone">
                </div>
                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <div class="input-group">
                        <input type="password" class="form-control" name="password" id="registerPassword" required minlength="4">
                        <button class="btn btn-outline-secondary" type="button" data-toggle-password="registerPassword" aria-label="Show password">
                            <i class="bi bi-eye"></i>
                        </button>
                    </div>
                </div>
                <button type="submit" class="btn btn-success w-100">Register</button>
            </form>
            <p class="mt-3 mb-0 text-muted-small">Already have an account? <a href="{{ url_for('login') }}">Login here</a></p>
        </div>
    </div>
</div>
{% endblock %}
